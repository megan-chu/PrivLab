<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PrivLab: Reports in. Structured data out. Built for healthcare professionals.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c30"/>
      <stop offset="1" stop-color="#050e1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00dbab" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#00dbab" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
  </g>

  <!-- logo lockup -->
  <g transform="translate(80 58) scale(0.24)">
    <path d="M0 0H324V150H263V87H87V400H0Z" fill="#ffffff"/>
    <rect x="87" y="150" width="275" height="87" fill="#00dbab"/>
  </g>
  <text x="190" y="136" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1.5">PrivLab</text>

  <!-- headline -->
  <text x="80" y="222" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="34" fill="#ffffff">Reports in. <tspan fill="#00dbab">Structured data out.</tspan></text>
  <text x="80" y="290" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#8aa0b8">Built for healthcare professionals<tspan fill="#3d5672">   •   </tspan>Identifiers stay on your computer</text>

  <!-- product window -->
  <rect x="748" y="56" width="452" height="248" rx="14" fill="#0f2236" stroke="#213d5b"/>
  <path d="M748 70a14 14 0 0 1 14-14h424a14 14 0 0 1 14 14v26H748z" fill="#132a42"/>
  <line x1="748" y1="96" x2="1200" y2="96" stroke="#213d5b"/>
  <circle cx="772" cy="76" r="5" fill="#2c4a6a"/>
  <circle cx="790" cy="76" r="5" fill="#2c4a6a"/>
  <circle cx="808" cy="76" r="5" fill="#2c4a6a"/>
  <text x="974" y="81" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6f88a3">report.txt  ·  masked on your device</text>

  <g font-family="Consolas, Menlo, monospace" font-size="16">
    <text x="776" y="136" fill="#6f88a3">Patient</text>
    <text x="862" y="136" fill="#ff7a93" fill-opacity="0.85" text-decoration="line-through">Jane Doe</text>
    <rect x="944" y="119" width="100" height="25" rx="6" fill="#8ea6ff" fill-opacity="0.14"/>
    <text x="994" y="136" text-anchor="middle" fill="#b9c7ff">[PERSON-1]</text>

    <text x="776" y="170" fill="#6f88a3">MRN</text>
    <text x="862" y="170" fill="#ff7a93" fill-opacity="0.85" text-decoration="line-through">849204</text>
    <rect x="926" y="153" width="76" height="25" rx="6" fill="#8ea6ff" fill-opacity="0.14"/>
    <text x="964" y="170" text-anchor="middle" fill="#b9c7ff">[MRN-1]</text>

    <text x="776" y="204" fill="#6f88a3">Site</text>
    <rect x="862" y="187" width="156" height="25" rx="6" fill="#00dbab" fill-opacity="0.15"/>
    <rect x="862" y="210" width="156" height="2" fill="#00dbab"/>
    <text x="940" y="204" text-anchor="middle" fill="#ffffff">Right upper lobe</text>
  </g>

  <line x1="776" y1="232" x2="1172" y2="232" stroke="#213d5b"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="776" y="276" font-size="16" fill="#8aa0b8">Primary site</text>
    <circle cx="1018" cy="270" r="10" fill="#00dbab"/>
    <path d="M1013 270.5l3.5 3.5 6.5-7" stroke="#07182a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1172" y="276" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">Right upper lobe</text>
  </g>
</svg>
