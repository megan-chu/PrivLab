<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Where your data goes. On your device: report in, find details with patterns and a local name model, you confirm, masked text; then checks in code, you validate, export; encrypted vault and learned examples stay on the device. Only masked text goes to the Meta models: Muse Spark Open on Baseten for the privacy guardrail, Muse Spark 1.3 on the Meta Model API for field definitions and extraction, and the optional Elephant-1 for a second opinion. Values come back with their quotes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c30"/>
      <stop offset="1" stop-color="#050e1a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12283f"/>
      <stop offset="1" stop-color="#0c1b2c"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#5f7a96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#9cc4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- device panel -->
    <rect x="30" y="40" width="760" height="360" rx="18" fill="#00dbab" fill-opacity="0.03" stroke="#00dbab" stroke-opacity="0.35"/>
    <text x="54" y="74" font-size="12" font-weight="700" fill="#00dbab" letter-spacing="2">YOUR DEVICE</text>
    <text x="166" y="74" font-size="13" fill="#5f7a96">the original report never leaves</text>

    <!-- row 1 -->
    <rect x="48"  y="96" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <rect x="234" y="96" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <rect x="420" y="96" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <rect x="606" y="96" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <g font-size="17" font-weight="700" fill="#ffffff">
      <text x="66"  y="136">Report in</text>
      <text x="252" y="136">Find details</text>
      <text x="438" y="136">You confirm</text>
      <text x="624" y="136">Masked text</text>
    </g>
    <g font-size="13.5" fill="#8aa0b8">
      <text x="66"  y="162">text file, pasted</text><text x="66" y="182">text or PDF</text>
      <text x="252" y="162">patterns and a</text><text x="252" y="182">local name model</text>
      <text x="438" y="162">what to mask,</text><text x="438" y="182">before anything</text><text x="438" y="202">is sent</text>
      <text x="624" y="162">details become</text><text x="624" y="182">tags</text>
    </g>
    <rect x="624" y="190" width="94" height="20" rx="5" fill="#8ea6ff" fill-opacity="0.14"/>
    <text x="671" y="205" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#b9c7ff">[PERSON-1]</text>
    <g stroke="#5f7a96" stroke-width="1.6" marker-end="url(#arr)">
      <line x1="216" y1="156" x2="231" y2="156"/>
      <line x1="402" y1="156" x2="417" y2="156"/>
      <line x1="588" y1="156" x2="603" y2="156"/>
    </g>

    <!-- row 2 (right to left) -->
    <rect x="48"  y="252" width="166" height="120" rx="14" fill="#0b1927" stroke="#213d5b" stroke-dasharray="5 5"/>
    <rect x="234" y="252" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <rect x="420" y="252" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <rect x="606" y="252" width="166" height="120" rx="14" fill="url(#card)" stroke="#213d5b"/>
    <g font-size="17" font-weight="700" fill="#ffffff">
      <text x="66"  y="292">Kept locally</text>
      <text x="252" y="292">Export</text>
      <text x="438" y="292">You validate</text>
      <text x="624" y="292">Checks in code</text>
    </g>
    <g font-size="13.5" fill="#8aa0b8">
      <text x="66"  y="318">encrypted vault</text><text x="66" y="338">and examples</text><text x="66" y="358">learned from you</text>
      <text x="252" y="318">CSV, masked text</text><text x="252" y="338">or the full zip</text>
      <text x="438" y="318">confirm or correct</text><text x="438" y="338">each value</text>
      <text x="624" y="318">every quote must</text><text x="624" y="338">be in the report</text>
    </g>
    <g stroke="#5f7a96" stroke-width="1.6" marker-end="url(#arr)">
      <line x1="603" y1="312" x2="588" y2="312"/>
      <line x1="417" y1="312" x2="402" y2="312"/>
    </g>

    <!-- gate: masked text out, values back -->
    <line x1="776" y1="156" x2="864" y2="156" stroke="#9cc4ff" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="820" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9cc4ff">masked</text>
    <text x="820" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9cc4ff">text only</text>
    <line x1="866" y1="312" x2="778" y2="312" stroke="#9cc4ff" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="822" y="288" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9cc4ff">values and</text>
    <text x="822" y="304" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9cc4ff">their quotes</text>

    <!-- meta panel -->
    <rect x="870" y="40" width="380" height="360" rx="18" fill="#6ea8ff" fill-opacity="0.03" stroke="#6ea8ff" stroke-opacity="0.35"/>
    <text x="894" y="74" font-size="12" font-weight="700" fill="#6ea8ff" letter-spacing="2">META MODELS</text>
    <text x="1012" y="74" font-size="13" fill="#5f7a96">see masked text only</text>

    <rect x="888" y="96" width="344" height="88" rx="14" fill="url(#card)" stroke="#2a4a78"/>
    <text x="906" y="126" font-size="17" font-weight="700" fill="#ffffff">Muse Spark Open</text>
    <rect x="1060" y="111" width="156" height="22" rx="11" fill="#6ea8ff" fill-opacity="0.14"/>
    <text x="1138" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9cc4ff">Baseten · open weights</text>
    <text x="906" y="152" font-size="13.5" fill="#8aa0b8">Privacy guardrail: flags any identifier</text>
    <text x="906" y="171" font-size="13.5" fill="#8aa0b8">the rules missed</text>

    <rect x="888" y="194" width="344" height="88" rx="14" fill="url(#card)" stroke="#2a4a78"/>
    <text x="906" y="224" font-size="17" font-weight="700" fill="#ffffff">Muse Spark 1.3</text>
    <rect x="1060" y="209" width="156" height="22" rx="11" fill="#6ea8ff" fill-opacity="0.14"/>
    <text x="1138" y="224" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9cc4ff">Meta Model API</text>
    <text x="906" y="250" font-size="13.5" fill="#8aa0b8">Field definitions and extraction,</text>
    <text x="906" y="269" font-size="13.5" fill="#8aa0b8">each value with its quote</text>

    <rect x="888" y="292" width="344" height="88" rx="14" fill="url(#card)" stroke="#2a4a78" stroke-dasharray="5 5"/>
    <text x="906" y="322" font-size="17" font-weight="700" fill="#ffffff">Elephant-1</text>
    <rect x="1060" y="307" width="156" height="22" rx="11" fill="#6ea8ff" fill-opacity="0.14"/>
    <text x="1138" y="322" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9cc4ff">Baseten · optional</text>
    <text x="906" y="348" font-size="13.5" fill="#8aa0b8">Second opinion: does a value</text>
    <text x="906" y="367" font-size="13.5" fill="#8aa0b8">need your review?</text>
  </g>
</svg>
