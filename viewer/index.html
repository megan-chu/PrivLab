<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='194 175 362 400'%3E%3Cpath fill='%2307182A' d='M194 175H518V325H457V262H281V575H194Z'/%3E%3Crect fill='%2300DBAB' x='281' y='325' width='275' height='87'/%3E%3C/svg%3E">
<style>
/* Tokens: PrivLab design system (H&E palette). Fonts are local only: the viewer handles report
   text, so it never calls a font CDN; IBM Plex / Schibsted Grotesk are used when installed. */
:root {
  color-scheme: light;
  --surface: #f7f7fb; --surface-raised: #ffffff; --surface-sunken: #ecebf2; --line: #d9d7e6; --line-strong: #7b78a0;
  --ink: #1c1930; --ink-muted: #5b5772; --hema: #3d2f86; --on-hema: #ffffff; --eosin: #b02a5f; --eosin-tint: #fbe3ec;
  --verified: #0a6e7a; --verified-bg: #e0f2f3; --review: #8a4b00; --review-bg: #fdf0d9;
  --not-stated: #5b5772; --not-stated-bg: #ecebf2; --refused: #a11d2b; --refused-bg: #fbe4e6;
  --id-name: #fde3ea; --id-doctor: #e9e5fb; --id-number: #fdecd6; --id-date: #dff3ee; --id-record: #e3e8fa; --id-contact: #f6efd0; --id-place: #e2eef6;
  --shadow-raised: 0 1px 2px rgba(28,25,48,.08), 0 4px 12px rgba(28,25,48,.06);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  --r-sm: 4px; --r-md: 8px; --target: 44px; --panel: 440px; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --surface: #14121f; --surface-raised: #1d1a2c; --surface-sunken: #262338; --line: #36324d; --line-strong: #6f6a8f;
  --ink: #ecebf5; --ink-muted: #a7a3bf; --hema: #a99cf0; --on-hema: #14121f; --eosin: #f07aa6; --eosin-tint: #3a1828;
  --verified: #5cc8d2; --verified-bg: #0f2e33; --review: #f2b65a; --review-bg: #3a2a0e;
  --not-stated: #a7a3bf; --not-stated-bg: #262338; --refused: #f28b95; --refused-bg: #3d1519;
  --id-name: #4a2433; --id-doctor: #34295c; --id-number: #4a3418; --id-date: #193a33; --id-record: #252f55; --id-contact: #3f3818; --id-place: #1c3446;
  --shadow-raised: 0 1px 2px rgba(0,0,0,.5); } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 15px/22px var(--f-sans); color: var(--ink); background: var(--surface); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--eosin); outline-offset: 2px; border-radius: var(--r-sm); }
svg { width: 16px; height: 16px; flex: none; }
.muted { color: var(--ink-muted); }
.sm { font-size: 13px; line-height: 18px; }
.label { font: 600 12px/16px var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }

/* ---------- top bar ---------- */
.top { height: 56px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s6); background: var(--surface-raised); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: var(--s2); font: 700 18px/1 var(--f-display); letter-spacing: -.01em; }
.brand .logo { width: 24px; height: 26px; flex: none; }
.brand .logo .ink { fill: #07182a; } .brand .logo .bar { fill: #00dbab; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .logo .ink { fill: #ecebf5; } }
.value { flex: 1; display: flex; justify-content: center; gap: var(--s6); color: var(--ink-muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.value b { color: var(--ink); font: 500 13px var(--f-mono); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-md); color: var(--ink-muted); font-weight: 600; font-size: 14px; text-decoration: none; }
.tbtn:hover { background: var(--surface-sunken); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: var(--s1); height: 22px; padding: 0 var(--s2); border-radius: 999px;
  font: 600 12px/16px var(--f-sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; background: var(--surface-sunken); color: var(--ink-muted); }
.pill.verified { background: var(--verified-bg); color: var(--verified); } .pill.review { background: var(--review-bg); color: var(--review); }
.pill.not-stated { background: var(--not-stated-bg); color: var(--not-stated); } .pill.refused { background: var(--refused-bg); color: var(--refused); }
.pill.hema { background: var(--hema); color: var(--on-hema); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr) var(--panel); height: calc(100vh - 56px); }
.rail { background: var(--surface-raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.rail-head { display: flex; align-items: center; justify-content: space-between; padding: var(--s4) var(--s4) var(--s2); }
.rail-list { flex: 1; overflow: auto; padding: 0 var(--s2) var(--s4); }
.row { width: 100%; min-height: var(--target); text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s2); padding: var(--s3); border-radius: var(--r-md); }
.row:hover { background: var(--surface); }
.row.on { background: var(--surface-sunken); box-shadow: inset 3px 0 0 var(--hema); }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1 / -1; color: var(--ink-muted); font-size: 13px; line-height: 18px; display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.high { background: var(--refused); } .dot.medium { background: var(--review); } .dot.low { background: var(--verified); }

.center { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.stepper { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s8) 0; min-height: 40px; }
.step { display: flex; align-items: center; gap: var(--s2); color: var(--ink-muted); font-weight: 600; font-size: 13px; }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-mono); background: var(--surface-sunken); color: var(--ink-muted); }
.step.on { color: var(--ink); } .step.on .n { background: var(--hema); color: var(--on-hema); }
.step.done .n { background: var(--verified-bg); color: var(--verified); }
.step-line { width: 28px; height: 1px; background: var(--line); }
.where { padding: var(--s2) var(--s8) var(--s3); display: flex; gap: var(--s2); align-items: center; font-size: 13px; line-height: 18px; color: var(--ink-muted); min-height: 40px; }
.docwrap { flex: 1; overflow: auto; padding: 0 var(--s8) var(--s8); min-height: 0; }
.doc { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s8); white-space: pre-wrap;
  font: 15px/24px var(--f-sans); max-width: calc(68ch + 64px); margin: 0 auto; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(68ch + 64px); margin: 0 auto var(--s3); }
mark { color: inherit; border-radius: var(--r-sm); padding: 1px 2px; cursor: pointer; transition: background .12s var(--ease); }
mark.kept { background: transparent !important; text-decoration: line-through; text-decoration-color: var(--line-strong); box-shadow: inset 0 0 0 1px var(--line); }
mark.added { box-shadow: inset 0 0 0 2px var(--hema); }
mark.hold { background: var(--review-bg); box-shadow: inset 0 0 0 2px var(--review); }
mark.flag { background: var(--refused-bg); box-shadow: inset 0 0 0 2px var(--refused); }
mark.suspect { background: transparent; box-shadow: inset 0 0 0 2px var(--refused); }
mark.redact { background: var(--hema); color: var(--on-hema); font: 500 13px var(--f-mono); padding: 1px 4px; cursor: default; }
mark.quote { background: var(--eosin-tint); box-shadow: inset 0 0 0 1.5px var(--hema); }
mark.pulse { animation: pulse 1s var(--ease) 1; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(176,42,95,.45); } to { box-shadow: 0 0 0 8px rgba(176,42,95,0); } }
/* identifier types: id-* tokens; the legend chip's word carries the meaning */
.t-NAME { background: var(--id-name); } .t-DOCTOR { background: var(--id-doctor); } .t-ID { background: var(--id-number); }
.t-DOB, .t-DATE { background: var(--id-date); } .t-MRN, .t-ACCESSION, .t-ACCOUNT { background: var(--id-record); }
.t-PHONE, .t-EMAIL, .t-ADDRESS { background: var(--id-contact); } .t-HOSPITAL { background: var(--id-place); }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--s2); border-radius: var(--r-sm); font-size: 13px; color: var(--ink); }

/* ---------- side panel ---------- */
.panel { background: var(--surface-raised); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.pbody { flex: 1; overflow: auto; padding: var(--s6); }
.pfoot { padding: var(--s4) var(--s6); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
.h1 { font: 600 20px/28px var(--f-display); margin: 0 0 var(--s1); }
.lede { color: var(--ink-muted); font-size: 13px; line-height: 18px; margin: 0 0 var(--s4); }
.btn { min-height: var(--target); border-radius: var(--r-md); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); padding: 0 var(--s4); text-decoration: none; }
.btn.primary { width: 100%; background: var(--hema); color: var(--on-hema); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.secondary { width: 100%; background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line-strong); }
.btn.secondary:hover { background: var(--surface); }
.btn:disabled { background: var(--surface-sunken); color: var(--ink-muted); border-color: transparent; cursor: default; filter: none; }
.btn.inline { width: auto; min-height: 36px; padding: 0 var(--s3); font-size: 14px; }
.link { color: var(--hema); font-weight: 600; font-size: 14px; min-height: 32px; display: inline-flex; align-items: center; }
.link:hover { text-decoration: underline; }
.kbd { font: 500 11px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: var(--r-sm); color: var(--ink-muted); }
.hint { text-align: center; color: var(--ink-muted); font-size: 13px; line-height: 18px; }
.big { display: flex; align-items: baseline; gap: var(--s2); margin-bottom: var(--s3); }
.big b { font: 600 28px/34px var(--f-display); }
.banner { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-radius: var(--r-md); margin-bottom: var(--s4); font-size: 14px; }
.banner b { display: block; }
.banner.verified { background: var(--verified-bg); } .banner.verified b { color: var(--verified); }
.banner.review { background: var(--review-bg); } .banner.review b { color: var(--review); }
.banner.refused { background: var(--refused-bg); } .banner.refused b { color: var(--refused); }
.banner.info { background: var(--surface-sunken); }
.banner .gl { font: 700 16px/22px var(--f-mono); width: 16px; text-align: center; }
.banner.verified .gl { color: var(--verified); } .banner.review .gl { color: var(--review); } .banner.refused .gl { color: var(--refused); }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.ctx { font: 13px/20px var(--f-mono); color: var(--ink-muted); overflow-wrap: anywhere; }
.toggle { appearance: none; width: 20px; height: 20px; border: 1.5px solid var(--line-strong); border-radius: var(--r-sm); margin-top: 1px; display: grid; place-items: center; cursor: pointer; flex: none; background: var(--surface-raised); }
.toggle:checked { background: var(--hema); border-color: var(--hema); }
.toggle:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid var(--on-hema); border-bottom: 2px solid var(--on-hema); transform: rotate(-45deg) translate(1px, -1px); }
.running { display: flex; align-items: center; gap: var(--s2); font-size: 13px; color: var(--ink-muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--hema); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tip { display: flex; gap: var(--s3); background: var(--surface-sunken); border-radius: var(--r-md); padding: var(--s3) var(--s4); font-size: 13px; line-height: 18px; margin-bottom: var(--s4); }
.tip button { margin-left: auto; color: var(--hema); font-weight: 600; white-space: nowrap; }
.trace { margin-top: var(--s6); border-top: 1px solid var(--line); padding-top: var(--s3); }
.trace summary { cursor: pointer; color: var(--ink-muted); font-size: 13px; }
.trace li { display: flex; gap: var(--s2); align-items: flex-start; font-size: 13px; line-height: 18px; padding: 6px 0; }
.wb { display: inline-flex; align-items: center; gap: 4px; font: 600 11px/16px var(--f-sans); letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: var(--r-sm); flex: none; }
.wb.local { background: var(--verified-bg); color: var(--verified); } .wb.cloud { background: var(--surface-sunken); color: var(--hema); }

/* fields: a list; each row is a button that selects its quote */
.fields { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.frow { display: block; width: 100%; text-align: left; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--surface-raised); }
.frow:last-child { border-bottom: 0; }
.frow.on { box-shadow: inset 3px 0 0 var(--hema); background: var(--surface); }
.frow.not-stated { background: var(--surface-sunken); }
.fhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.fname { font-weight: 600; }
.fval { font: 500 15px/22px var(--f-mono); font-variant-numeric: tabular-nums; margin-top: var(--s2); }
.fquote { font: 13px/20px var(--f-mono); color: var(--ink-muted); margin-top: var(--s1); overflow-wrap: anywhere; }
.freason { font-size: 13px; line-height: 18px; color: var(--ink); margin-top: var(--s2); }
.factions { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin-top: var(--s2); }
.choices { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.choice { min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface-raised); font: 500 14px var(--f-mono); }
.choice:hover { border-color: var(--hema); color: var(--hema); }
.editor { margin-top: var(--s3); display: grid; gap: var(--s2); }
input.in, select.in, textarea.in { width: 100%; min-height: 40px; padding: 0 var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface-raised); }
textarea.in { padding: var(--s2) var(--s3); resize: vertical; }
.skel { height: 64px; border-bottom: 1px solid var(--line); background: var(--surface-sunken); position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: sh 1.3s infinite; }
@keyframes sh { to { transform: translateX(100%); } }
.docskel { max-width: calc(68ch + 64px); margin: 0 auto; display: grid; gap: 12px; padding: var(--s8); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-md); }
.docskel i { display: block; height: 12px; border-radius: var(--r-sm); background: var(--surface-sunken); }

/* empty state */
.empty { max-width: 640px; margin: var(--s12) auto 0; }
.empty h1 { font: 700 40px/44px var(--f-display); letter-spacing: -.01em; margin: 0 0 var(--s2); }
.empty p { color: var(--ink-muted); margin: 0 0 var(--s6); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface-raised); padding: var(--s8) var(--s6); text-align: center; }
.drop.over { border-color: var(--hema); background: var(--surface-sunken); }
.drop .acts { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s4); }
.samples { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.sample { min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-raised); font-size: 14px; }
.sample:hover { border-color: var(--hema); color: var(--hema); }
.paste { width: 100%; min-height: 160px; margin-top: var(--s4); padding: var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: 13px/20px var(--f-mono); display: none; background: var(--surface-raised); }
.paste.show { display: block; }

/* selection toolbar */
.floatbar { position: fixed; z-index: 20; display: none; align-items: center; gap: var(--s1); padding: var(--s1); background: var(--ink); color: var(--surface-raised); border-radius: var(--r-md); box-shadow: var(--shadow-raised); font-size: 14px; }
.floatbar button { color: inherit; min-height: 36px; padding: 0 var(--s3); border-radius: 6px; font-weight: 600; }
.floatbar button:hover { background: rgba(255,255,255,.14); }
.floatbar select { background: transparent; color: inherit; border: 1px solid rgba(255,255,255,.3); min-height: 32px; border-radius: 6px; padding: 0 6px; }
.floatbar select option { color: #1c1930; }
.floatbar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.25); }

/* mode switch and export menu */
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-md); background: var(--surface-sunken); }
.seg button { min-height: 32px; padding: 0 var(--s3); border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--ink); box-shadow: 0 1px 2px rgba(28,25,48,.12); }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: 40px; z-index: 15; width: 300px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-raised); padding: var(--s2); }
.menu .pop a { display: block; padding: var(--s2) var(--s3); border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 600; }
.menu .pop a:hover { background: var(--surface); }
.menu .pop a span { display: block; font-weight: 400; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
/* step checklist (loading) */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.checklist li { display: flex; gap: var(--s3); align-items: flex-start; }
.checklist .mk { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 12px var(--f-mono); margin-top: 1px; }
.checklist .done .mk { background: var(--verified-bg); color: var(--verified); }
.checklist .todo .mk { border: 1.5px solid var(--line); }
.checklist .todo { color: var(--ink-muted); }
.checklist .run .mk { border: 2px solid var(--line); border-top-color: var(--hema); animation: spin .8s linear infinite; }
.checklist small { display: block; color: var(--ink-muted); font-size: 13px; line-height: 18px; }
.frow.loading { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); color: var(--ink-muted); }

/* side panel: fields list and new-field conversation */
.ptabs { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s4); }
.ptabs .seg { flex: 1; }
.ptabs .seg button { flex: 1; }
.flist .item .meta { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.thread { display: grid; gap: var(--s3); }
.msg { max-width: 92%; padding: var(--s3) var(--s4); border-radius: 12px; font-size: 14px; line-height: 20px; }
.msg .who { display: block; font: 600 11px/16px var(--f-sans); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.msg.spark { background: var(--surface-sunken); border-top-left-radius: 4px; justify-self: start; }
.msg.spark .who { color: var(--hema); }
.msg.you { background: var(--hema); color: var(--on-hema); border-top-right-radius: 4px; justify-self: end; }
.msg.you .who { color: var(--on-hema); opacity: .8; }
.msg.note { justify-self: center; max-width: 100%; padding: 0 var(--s2); background: none; color: var(--ink-muted); font-size: 13px; line-height: 18px; text-align: center; }
.msg .spec { display: block; margin-top: var(--s1); font: 500 13px/20px var(--f-mono); color: var(--ink-muted); }
.msg .found { font: 500 15px/22px var(--f-mono); }
.msg .details { display: grid; gap: var(--s2); margin-top: var(--s2); }

/* dialog */

dialog.sheet::backdrop { background: rgba(28,25,48,.36); }

.sheet .sf { padding: var(--s4) var(--s6); border-top: 1px solid var(--line); display: flex; gap: var(--s2); justify-content: flex-end; }
.sheet .sf .btn { width: auto; }
.toast { position: fixed; left: 50%; bottom: var(--s6); transform: translateX(-50%) translateY(16px); opacity: 0; background: var(--ink); color: var(--surface-raised); padding: var(--s3) var(--s4); border-radius: var(--r-md); box-shadow: var(--shadow-raised); transition: all .18s var(--ease); z-index: 30; pointer-events: none; font-size: 14px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 1100px) { .app { grid-template-columns: 220px minmax(0, 1fr) 380px; } .value span:nth-child(n+3) { display: none; } }
</style>

<script>
"use strict";
// ======================================================================
// State and helpers
// ======================================================================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const icon = (n) => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const TYPES = ["NAME", "DOCTOR", "ID", "DOB", "DATE", "MRN", "ACCESSION", "PHONE", "EMAIL", "ADDRESS", "HOSPITAL"];
const TL = {NAME: "Name", DOCTOR: "Doctor", ID: "ID number", DOB: "Date of birth", DATE: "Date", MRN: "MRN", ACCESSION: "Accession",
  ACCOUNT: "Account", PHONE: "Phone", EMAIL: "Email", ADDRESS: "Address", HOSPITAL: "Hospital"};
const CHECK = {evidence_found: "quote found in the report", type_ok: "valid value", value_in_evidence: "value in the quote",
  section_ok: "reliable section", no_identifiers: "no identifiers"};
const FAIL = {evidence_found: "The quote is not in the report.", type_ok: "The value is the wrong type or out of range.",
  value_in_evidence: "The value is not in its quote.", no_identifiers: "The quote contains an identifier.", section_ok: "It comes from a less reliable section."};
const STATUS = {verified: ["✓", "Verified"], review: ["!", "Needs review"], "not-stated": ["–", "Not stated"], refused: ["×", "Refused"]};
const pill = (k) => `<span class="pill ${k}">${STATUS[k][0]} ${STATUS[k][1]}</span>`;
const store = {get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }};
const S = {reports: [], cur: -1, fields: [], profile: null, samples: [], demo: false, choices: null,
  mode: store.get("mode") === "deid" ? "deid" : "both"};
const extracting = () => S.mode === "both";
S.side = null; S.chat = null;           // side panel: null | "fields" | "chat"
let seq = 0;

async function api(path, body) {
  try {
    const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    return await r.json();
  } catch (e) {
    return {error: "The PrivLab server is not reachable. Start it with python -m viewer.server, then try again.", offline: true};
  }
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3600); }
const cur = () => S.reports[S.cur];
const trace = (r, msg, where, ok = true) => r.trace.push({msg, where, ok});
const fmtSecs = (s) => s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
const clock = (d) => d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const sectionName = (s) => ({diagnosis: "Diagnosis", synoptic: "Synoptic", gross: "Gross", history: "Clinical history", addendum: "Addendum", comment: "Comment"}[s] || (s ? s[0].toUpperCase() + s.slice(1) : "Report"));

function marked(text, marks) {
  marks = marks.filter((m) => m.start != null && m.end > m.start).sort((a, b) => a.start - b.start || b.end - a.end);
  let out = "", pos = 0;
  for (const m of marks) {
    if (m.start < pos) continue;
    out += esc(text.slice(pos, m.start)) + `<mark class="${m.cls}" data-id="${esc(m.id || "")}"${m.title ? ` title="${esc(m.title)}"` : ""}>${esc(text.slice(m.start, m.end))}</mark>`;
    pos = m.end;
  }
  return out + esc(text.slice(pos));
}
function redactions(text) {
  const out = [], re = /\[[A-Z]+-\d+\]/g; let m;
  while ((m = re.exec(text))) out.push({start: m.index, end: m.index + m[0].length, cls: "redact"});
  return out;
}
function docSelection() {
  const doc = document.querySelector(".doc"), sel = window.getSelection();
  if (!doc || !sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  if (!doc.contains(range.commonAncestorContainer)) return null;
  const full = doc.textContent, pre = document.createRange();
  pre.setStart(doc, 0); pre.setEnd(range.startContainer, range.startOffset);
  let a = pre.toString().length, b = a + range.toString().length;
  while (a > 0 && /\S/.test(full[a - 1]) && /\S/.test(full[a])) a--;            // snap to whole words
  while (b < full.length && /\S/.test(full[b]) && /\S/.test(full[b - 1])) b++;
  const text = full.slice(a, b).trim().replace(/[.,;:]+$/, "");
  return text ? {text, rect: range.getBoundingClientRect()} : null;
}
function showMark(id) {
  const m = document.querySelector(`.doc mark[data-id="${CSS.escape(id)}"]`);
  if (!m) return;
  const wrap = $("docwrap"), top = m.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (top < 60 || top > wrap.clientHeight - 60) wrap.scrollTo({top: wrap.scrollTop + top - wrap.clientHeight / 2, behavior: reduce ? "auto" : "smooth"});
  m.classList.remove("pulse"); void m.offsetWidth; m.classList.add("pulse");
}

// ======================================================================
// Frame: value strip, worklist, stepper
// ======================================================================
const RSTAT = {loading: ["De-identifying", ""], setup: ["Set up", ""], review: ["Review", ""], checking: ["Checking", ""],
  hold: ["Needs review", "review"], flags: ["Needs review", "review"], safe: ["De-identified", "verified"], blocked: ["Refused", "refused"],
  fields: ["Extracting", ""], approved: ["Approved", "verified"], failed: ["Error", "refused"]};
function renderTop() {
  const rs = S.reports, safe = rs.filter((r) => ["safe", "fields", "approved"].includes(r.step)).length;
  const done = rs.filter((r) => r.step === "approved");
  const filled = rs.reduce((n, r) => n + Object.values(r.saved).filter((o) => o.value != null).length, 0);
  const typed = rs.reduce((n, r) => n + r.typed, 0);
  const avg = done.length ? done.reduce((n, r) => n + (r.doneAt - r.openedAt), 0) / done.length / 1000 : null;
  const exported = rs.filter((r) => r.exported).length;
  $("value").innerHTML = rs.length
    ? `<span><b>${safe}/${rs.length}</b> reports de-identified</span><span><b>0</b> identifiers sent before you confirmed</span>
       ${extracting() ? `<span><b>${filled}</b> fields filled</span><span><b>${typed}</b> typed by hand</span>${avg ? `<span><b>${fmtSecs(avg)}</b> per report</span>` : ""}`
         : `<span><b>${exported}</b> downloaded</span>`}`
    : `<span>Nothing leaves this laptop until you confirm.</span>`;
}
function renderRail() {
  $("rail").innerHTML = S.reports.length ? S.reports.map((r, i) => {
    const [label, cls] = r.step === "safe" && r.exported ? ["Exported", "verified"] : RSTAT[r.step] || ["", ""];
    const pr = r.done && r.done.review_priority ? r.done.review_priority.level : null;
    return `<button class="row ${i === S.cur ? "on" : ""}" data-i="${i}" aria-current="${i === S.cur}">
      <span class="name">${esc(r.name)}</span><span class="pill ${cls}">${label}</span>
      <span class="sub">${pr ? `<span class="dot ${pr}" title="Review priority: ${pr}"></span>` : ""}${esc(r.cancer || (r.sample ? "Sample" : "Your file"))}${r.dets ? ` · ${r.dets.length} identifiers` : ""}</span></button>`;
  }).join("") : `<p class="sm muted" style="padding:0 var(--s3)">No reports yet.</p>`;
}
$("rail").addEventListener("click", (e) => { const b = e.target.closest(".row"); if (b) select(+b.dataset.i); });
function select(i) { S.cur = i; hideFloat(); render(); $("docwrap").scrollTop = 0; }
function render() { renderTop(); renderRail(); renderMain(); }
function refresh(r) { r === cur() ? render() : (renderTop(), renderRail()); }

function stepper(active) {
  const steps = extracting() ? ["De-identify", "Extract fields", "Approve"] : ["De-identify", "Export"];
  if (!extracting()) active = active === 0 ? 0 : active >= 3 ? 2 : 1;
  $("stepper").innerHTML = steps.map((s, k) => `${k ? '<span class="step-line"></span>' : ""}
    <span class="step ${k === active ? "on" : k < active ? "done" : ""}"><span class="n">${k < active ? "✓" : k + 1}</span>${s}</span>`).join("");
}
const LOCAL = `<span class="wb local">Laptop</span>`, CLOUD = `<span class="wb cloud">Muse Spark · masked text only</span>`;
const where = (html) => $("where").innerHTML = html;
const running = (txt) => `<span class="running"><span class="spin"></span>${esc(txt)}</span>`;
function setDoc(html, legend = "") { $("view").innerHTML = `${legend ? `<div class="legend">${legend}</div>` : ""}<div class="doc" id="doc">${html}</div>`; }
function setPanel(body, foot) { $("pbody").innerHTML = body; $("pfoot").innerHTML = foot || ""; $("pfoot").style.display = foot ? "" : "none"; }
const tip = (key, text) => store.get("tip:" + key) ? "" : `<div class="tip"><span>${text}</span><button data-tip="${key}">Got it</button></div>`;
$("pbody").addEventListener("click", (e) => { const t = e.target.closest("[data-tip]"); if (t) { store.set("tip:" + t.dataset.tip, "1"); t.parentElement.remove(); } });
const banner = (kind, title, text) => `<div class="banner ${kind}" role="${kind === "refused" ? "alert" : "status"}"><span class="gl">${{verified: "✓", review: "!", refused: "×", info: "i"}[kind]}</span><div><b>${title}</b>${text ? `<span>${text}</span>` : ""}</div></div>`;

function renderMain() {
  const r = cur();
  if (!r) { viewEmpty(); if (S.side) renderSide(null); return; }
  if (S.side && extracting()) { mainView(r); renderSide(r); return; }
  mainView(r);
}
function mainView(r) {
  ({loading: viewLoading, setup: viewSetup, review: viewReview, checking: viewChecking, hold: viewQuestion, flags: viewQuestion,
    safe: viewSafe, blocked: viewBlocked, fields: viewFields, approved: viewApproved, failed: viewFailed})[r.step](r);
}

// ======================================================================
// Empty state and adding reports
// ======================================================================
function viewEmpty() {
  $("stepper").innerHTML = ""; where("");
  const picks = [...new Map(S.samples.filter((x) => x.split === "extra").map((x) => [x.cancer, x])).values()]
    .map((x) => S.samples.find((y) => y.split === "extra" && y.cancer === x.cancer));     // first of each cancer type
  $("view").innerHTML = `<div class="empty">
    <h1>De-identify a pathology report</h1>
    <p>Identifiers are found on this laptop. Nothing is sent anywhere until you confirm, and then only masked text.</p>
    <div class="drop" id="drop">
      <div style="font-weight:600">No reports yet. Drop a text report to start.</div>
      <div class="hint">.txt files, one report per file. They stay in memory on this laptop.</div>
      <div class="acts"><button class="btn secondary inline" id="browse">${icon("upload")}Choose files</button>
        <button class="btn secondary inline" id="pasteBtn">Paste text</button></div>
      <textarea class="paste" id="paste" aria-label="Report text" placeholder="Paste the report text here"></textarea>
      <button class="btn primary" id="pasteAdd" style="display:none;margin-top:var(--s3)">De-identify pasted report</button>
    </div>
    <p class="label" style="margin:var(--s6) 0 0">Or try a sample report</p>
    <div class="samples">${picks.map((x) => `<button class="sample" data-sample="${x.id}">${x.id} · ${esc(x.cancer)}</button>`).join("")}
      <select class="sample" id="moreSamples" aria-label="More sample reports"><option value="">More samples</option>
      ${S.samples.map((x) => `<option value="${x.id}">${x.id} · ${esc(x.cancer)} · ${x.split}</option>`).join("")}</select></div>
    <p class="sm muted">Samples are real TCGA report text with synthetic identifiers.</p>
  </div>`;
  const how = extracting() ? [["De-identify", "Names, IDs and contact details are found and hidden on this laptop. You check them, then confirm."],
      ["Extract fields", "Each field you choose is filled from the de-identified text, with the quote it came from."],
      ["Approve", "Confirm or edit each value. PrivLab learns from every correction. Export fields as CSV."]]
    : [["De-identify", "Names, IDs and contact details are found and hidden on this laptop. You check them, then confirm."],
      ["Export", "Download the de-identified text, one report or all of them. No fields are extracted."]];
  setPanel(`<h2 class="h1">${extracting() ? "Three steps" : "Two steps"}</h2><p class="lede">One button per step, always here at the bottom. Choose De-identify only or De-identify + extract at the top.</p>
    <ol class="list">${how.map(([t, d], k) =>
      `<li class="item"><span class="pill hema">${k + 1}</span><div class="grow"><b>${t}</b><div class="sm muted">${d}</div></div></li>`).join("")}</ol>
    ${S.fields.length || !extracting() ? "" : banner("info", "No fields yet", 'Add the fields you want filled with <button class="link" id="emptyNew">New field</button>, for example tumour size.')}`);
  if ($("emptyNew")) $("emptyNew").onclick = () => chatOpen();
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
  $("browse").onclick = () => $("fileInput").click();
  $("pasteBtn").onclick = () => { $("paste").classList.add("show"); $("pasteAdd").style.display = ""; $("paste").focus(); };
  $("pasteAdd").onclick = () => { const t = $("paste").value; t.trim() ? addText("Pasted report " + (++seq), t) : toast("Paste the report text first."); };
  document.querySelectorAll("[data-sample]").forEach((b) => b.onclick = () => addSample(b.dataset.sample));
  $("moreSamples").onchange = (e) => e.target.value && addSample(e.target.value);
}
$("fileInput").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("addBtn").onclick = () => { S.cur = -1; render(); };
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { if (!e.target.closest("#drop")) { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); } });

async function addFiles(files) {
  for (const f of files) {
    if (!/\.txt$/i.test(f.name) && f.type !== "text/plain") { toast(`${f.name} is not a text file. Save the report as .txt and drop it again.`); continue; }
    await addText(f.name, await f.text());
  }
}
const newReport = (name, extra) => ({key: ++seq, name, step: "loading", unmark: new Set(), add: [], dets: null, results: {}, saved: {},
  typed: 0, trace: [], prefetch: "none", openedAt: performance.now(), ...extra});
function addText(name, text) { return start(newReport(name.replace(/\.txt$/i, ""), {preview: text}), "/api/add", {name, text}); }
function addSample(id) { const m = S.samples.find((x) => x.id === id) || {}; return start(newReport(id, {sample: true, cancer: m.cancer}), "/api/deid", {report_id: id}); }
async function start(r, path, body) {
  r.req = {path, body};
  S.reports.push(r); S.cur = S.reports.length - 1;
  if (!S.profile.exists && !S.choices) { r.step = "setup"; return render(); }
  return layer1(r);
}
async function layer1(r) {
  r.step = "loading"; r.error = null;
  const slow = setTimeout(() => refresh(r), 120);                 // skeleton only if it takes noticeable time
  const t0 = performance.now(), res = await api(r.req.path, {...r.req.body, choices: S.choices});
  clearTimeout(slow);
  if (res.error) { r.step = "failed"; r.error = {title: "This report could not be de-identified", text: res.error, retry: () => layer1(r)}; return refresh(r); }
  if (res.next === "profile") { S.profile.exists = false; r.step = "setup"; return refresh(r); }
  S.profile.exists = true;
  Object.assign(r, {text: res.text, deid: res.deid_id, dets: res.detections, step: "review", name: res.name || r.name});
  (res.warnings || []).forEach(toast);
  trace(r, `Found ${res.detections.length} identifiers in ${Math.round(performance.now() - t0)} ms. Nothing sent.`, "local");
  refresh(r);
}
function checklist(items) {      // [[label, "done" | "run" | "todo", detail]]
  return `<ol class="checklist" aria-live="polite">${items.map(([t, st, d]) =>
    `<li class="${st}"><span class="mk">${st === "done" ? "✓" : ""}</span><div><b>${t}</b>${d ? `<small>${d}</small>` : ""}</div></li>`).join("")}</ol>`;
}
function viewLoading(r) {
  stepper(0); where(`${LOCAL}${running("De-identifying on this laptop")}`);
  if (r.preview) setDoc(esc(r.preview));
  else $("view").innerHTML = `<div class="docskel" aria-label="Opening the report">${Array.from({length: 14}, (_, k) => `<i style="width:${55 + (k * 37) % 45}%"></i>`).join("")}</div>`;
  setPanel(`<h2 class="h1">De-identifying</h2><p class="lede">Everything in this step runs on this laptop. Nothing is sent.</p>
    ${checklist([["Report opened", "done", "Kept in memory only"], ["Finding identifiers", "run", "Names, ID numbers, dates of birth, contact details"],
      ["Your review", "todo", "You check every highlight before anything else happens"]])}`, `<button class="btn primary" disabled>De-identifying…</button>`);
}
function viewFailed(r) {
  stepper(0); where("");
  setDoc(esc(r.preview || r.text || ""));
  setPanel(banner("refused", esc(r.error.title), esc(r.error.text)), `<button class="btn primary" id="retry">Try again</button>
    <button class="btn secondary" id="drop1">Remove this report</button>`);
  $("retry").onclick = r.error.retry;
  $("drop1").onclick = () => { S.reports.splice(S.cur, 1); S.cur = S.reports.length - 1; render(); };
}

// first use: privacy profile
function viewSetup(r) {
  stepper(0); where(LOCAL);
  setDoc(r.preview ? esc(r.preview) : '<span class="muted">The sample opens after you choose what to hide.</span>');
  setPanel(`<h2 class="h1">What should be hidden?</h2><p class="lede">Asked once and saved as your privacy profile. Clinical dates stay, because registries need them.</p>

// ======================================================================
// Step 1: de-identify
// ======================================================================
function reviewMarks(r) {
  const marks = r.dets.map((d) => ({start: d.start, end: d.end, id: d.id, title: `${TL[d.type] || d.type}. Click to keep it visible.`,
    cls: `t-${d.type}` + (r.unmark.has(d.id) ? " kept" : "")}));
  r.add.forEach((a, i) => { let k = -1; while ((k = r.text.indexOf(a.text, k + 1)) >= 0) marks.push({start: k, end: k + a.text.length, id: "add" + i, cls: `t-${a.type} added`, title: "Added by you. Click to remove."}); });
  return marks;
}
function counts(r) {
  const c = {};
  r.dets.forEach((d) => { if (!r.unmark.has(d.id)) c[d.type] = (c[d.type] || 0) + 1; });
  r.add.forEach((a) => c[a.type] = (c[a.type] || 0) + 1);
  return c;
}
function viewReview(r) {
  stepper(0); where(`${LOCAL}<span>Nothing has left this laptop</span>`);
  const c = counts(r), n = Object.values(c).reduce((a, b) => a + b, 0);
  setDoc(marked(r.text, reviewMarks(r)), Object.entries(c).map(([t, k]) => `<span class="chip t-${t}">${TL[t] || t} · ${k}</span>`).join(""));
  setPanel(`${r.error ? banner("refused", esc(r.error.title), esc(r.error.text)) : ""}
    ${tip("review", "Click a highlight to keep it visible. Select any text in the report to hide something PrivLab missed.")}
    <h2 class="h1">Review what will be hidden</h2>
    <div class="big"><b>${n}</b><span class="muted">identifiers found on this laptop</span></div>
    <ul class="list">${r.dets.map((d) => `<li class="item"><input type="checkbox" class="toggle" data-det="${d.id}" ${r.unmark.has(d.id) ? "" : "checked"} aria-label="Hide ${esc(d.text)}">
      <div class="grow"><span class="chip t-${d.type}">${TL[d.type] || d.type}</span> ${esc(d.text)}</div><button class="link" data-go="${d.id}">Show</button></li>`).join("")}
      ${r.add.map((a, i) => `<li class="item"><input type="checkbox" class="toggle" checked data-add="${i}" aria-label="Stop hiding ${esc(a.text)}">
      <div class="grow"><span class="chip t-${a.type}">${TL[a.type] || a.type}</span> ${esc(a.text)} <span class="sm muted">added by you</span></div></li>`).join("")}</ul>
    ${traceBlock(r)}`,
    `<button class="btn primary" id="go">Hide ${n} and check for names</button>

  $("go").onclick = () => confirmReview(r);
  document.querySelectorAll("[data-det]").forEach((i) => i.onchange = () => toggleKeep(r, i.dataset.det));
  document.querySelectorAll("[data-add]").forEach((i) => i.onchange = () => { r.add.splice(+i.dataset.add, 1); renderMain(); });
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => showMark(b.dataset.go));
}
function toggleKeep(r, id) { r.unmark.has(id) ? r.unmark.delete(id) : r.unmark.add(id); renderMain(); }

async function confirmReview(r) {
  r.step = "checking"; r.error = null; render();
  const res = await api("/api/confirm", {deid_id: r.deid, unmark: [...r.unmark], add: r.add});
  if (!res.error) trace(r, `You confirmed: ${r.unmark.size} kept visible, ${r.add.length} added.`, "local");

}

  refresh(r);
}
function viewChecking(r) {
  stepper(0); where(`${CLOUD}${running("Second check")}`);

  setPanel(`<h2 class="h1">Second check</h2>

    ${checklist([[`${n} identifiers hidden`, "done", "On this laptop"], ["Masked text sealed and scanned for leftovers", "done", "On this laptop"],
      ["Second check for missed names", "run", "Muse Spark reads the masked text only"], ["Replace with tags", "todo", "Originals go to the encrypted vault on this laptop"]])}
    ${traceBlock(r)}`, `<button class="btn primary" disabled>Checking…</button>`);
}

function viewQuestion(r) {
  const q = r.question, hold = q.kind === "hold";
  stepper(0); where(hold ? `${LOCAL}<span>Paused before anything is sent</span>` : CLOUD);
  if (!q.picked) q.picked = new Set(q.items.filter((x) => hold || x.ticked).map((x) => x.id));
  const base = r.dets.filter((d) => !r.unmark.has(d.id)).map((d) => ({start: d.start, end: d.end, cls: `t-${d.type}`}));
  setDoc(marked(r.text, [...base, ...q.items.map((x) => ({start: x.start, end: x.end, id: x.id, title: "Click to change",
    cls: hold ? "hold" : x.ticked ? "flag" : "suspect"}))]));
  setPanel(`${r.error ? banner("refused", esc(r.error.title), esc(r.error.text)) : ""}
    ${banner("review", hold ? "These look like names" : "The second check found more", hold ? "Found on this laptop, before anything is sent. Ticked ones will be hidden; untick any that are not names, and PrivLab learns." :
      "Its finds are ticked to hide. Words it could not decide are unticked: tick any that identify a person.")}
    <ul class="list">${q.items.map((x) => `<li class="item"><input type="checkbox" class="toggle" data-q="${x.id}" ${q.picked.has(x.id) ? "checked" : ""} aria-label="Hide ${esc(x.text)}">
      <div class="grow">${esc(x.text)} <span class="sm muted">${x.source === "suspect" ? "undecided" : esc(TL[x.type] || x.type)}</span>
      <div class="ctx">${esc(x.context)}</div></div><button class="link" data-go="${x.id}">Show</button></li>`).join("")}</ul>${traceBlock(r)}`,
    `<button class="btn primary" id="go">Hide ${q.picked.size} and ${hold ? "check for names" : "finish"}</button>`);
  document.querySelectorAll("[data-q]").forEach((i) => i.onchange = () => { i.checked ? q.picked.add(i.dataset.q) : q.picked.delete(i.dataset.q); renderMain(); });
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => showMark(b.dataset.go));
  $("go").onclick = () => answer(r);
}
async function answer(r) {
  const q = r.question, back = r.step;
  r.step = "checking"; r.error = null; render();
  let res;
  if (q.kind === "hold") {
    const keep = q.items.filter((x) => !q.picked.has(x.id)).map((x) => x.id);
    res = await api("/api/hold", {deid_id: r.deid, keep});
    if (!res.error) trace(r, `You hid ${q.picked.size}, kept ${keep.length}.`, "local");
  } else {
    res = await api("/api/flags", {deid_id: r.deid, keep: q.items.filter((x) => x.ticked && !q.picked.has(x.id)).map((x) => x.id),
      hide: q.items.filter((x) => !x.ticked && q.picked.has(x.id)).map((x) => x.id)});
  }
  if (!res.error && res.next !== "error") r.question = null;
  handleNext(r, res, back);
}

const LAYER2 = {clean: "The second check found nothing more.", flagged: "You reviewed what the second check found.",
  unavailable: "The second check did not run, so read the text once before sharing it.", skipped: "The second check was not run."};

  trace(r, LAYER2[res.layer2] || res.layer2, res.layer2 === "skipped" ? "local" : "cloud", ["clean", "flagged"].includes(res.layer2));

}

}

    ${pr.level !== "low" ? `<p class="sm"><b>Review priority ${pr.level}.</b> ${pr.reasons.map(esc).join("; ")}.</p>` : ""}
    <div class="legend" style="margin:0">${Object.entries(res.summary.by_type).map(([t, k]) => `<span class="chip t-${t}">${TL[t] || t} · ${k}</span>`).join("")}</div>
    ${traceBlock(r)}`,

  if ($("go")) $("go").onclick = () => openFields(r);
  if ($("addField")) $("addField").onclick = () => chatOpen();

}
function nextButton(kind) {

  return `<button class="btn ${kind}" id="next" data-next="${next}">${next >= 0 ? `Next report ${icon("arrow")}` : `${icon("plus")}Add more reports`}</button>`;

function viewBlocked(r) {

    `<button class="btn primary" id="again">De-identify again</button>`);

// ======================================================================
// Step 2: extract fields
// ======================================================================
async function openFields(r) {
  r.step = "fields"; r.error = null; render();
  for (const f of S.fields) {
    if (r.results[f.key] || r.saved[f.key]) continue;
    const res = await api("/api/find", {deid_id: r.deid, field: f.key});
    if (res.error || res.status === "error") { r.error = {title: "Fields could not be extracted", text: res.error || res.reason}; break; }
    r.results[f.key] = res;
    const top = (res.candidates || []).find((c) => c.id === res.candidate_id);
    trace(r, `${f.name}: ${res.value != null ? res.value : status(res)[1]}` + (top ? ` (${Object.entries(top.checks).filter(([, k]) => !k).map(([k]) => "failed: " + CHECK[k]).join(", ") || "all checks passed"})` : ""),
      res.model_ms ? "cloud" : "local", res.status === "green");
    if (r === cur() && r.step === "fields") renderMain();
  }
  if (r === cur()) renderMain();
}
function status(res) {
  if (res.status === "green") return ["verified", "Verified"];
  if (res.status === "missing") return ["not-stated", "Not stated"];
  return (res.candidates || []).some((c) => !c.fail) ? ["review", "Needs review"] : ["refused", "Refused"];
}
const unit = (f, v) => v != null && f.type === "number" && f.unit ? ` ${esc(f.unit)}` : "";
function quoteMarks(r) {
  const marks = redactions(r.dtext), sel = r.focus;
  if (sel) {
    const res = r.results[sel.key], c = res && (res.candidates || []).find((x) => x.id === sel.cid);
    if (c && c.start != null) marks.push({start: c.start, end: c.end, id: `${sel.key}:${c.id}`, cls: "quote"});
  }
  return marks;
}
function viewFields(r) {
  stepper(1); where(`${CLOUD}<span>proposes each value; code checks it against the text</span>`);
  setDoc(marked(r.dtext, quoteMarks(r)));
  const open = S.fields.filter((f) => !r.saved[f.key]);
  const verified = open.filter((f) => r.results[f.key] && status(r.results[f.key])[0] === "verified");
  const pending = open.filter((f) => r.results[f.key] && status(r.results[f.key])[0] !== "verified");
  const loading = open.some((f) => !r.results[f.key]) && !r.error;
  let foot;
  if (loading) foot = `<button class="btn primary" disabled>Extracting fields…</button>`;
  else if (verified.length) foot = `<button class="btn primary" id="confirmAll">Confirm ${verified.length} verified value${verified.length > 1 ? "s" : ""}</button>
    <div class="hint">${pending.length ? `${pending.length} still need${pending.length > 1 ? "" : "s"} your review · ` : ""}<span class="kbd">↑</span> <span class="kbd">↓</span> fields · <span class="kbd">R</span> confirm</div>`;
  else if (open.length) foot = `<button class="btn primary" disabled>Review ${open.length} field${open.length > 1 ? "s" : ""} above</button>`;
  else foot = `<button class="btn primary" id="approve">Approve extraction ${icon("arrow")}</button>`;
  setPanel(`${loading ? `<p class="running" style="margin:0 0 var(--s3)"><span class="spin"></span>Extracting fields</p>` : ""}
    ${r.error ? banner("refused", esc(r.error.title), `${esc(r.error.text)} <button class="link" id="retry">Try again</button>`) : ""}
    ${!loading && pending.length ? banner("review", `${pending.length} field${pending.length > 1 ? "s" : ""} need${pending.length > 1 ? "" : "s"} your answer`, "Confirm, edit or mark not stated before approving.") : ""}
    ${tip("fields", "Select a field to see its quote in the report. To correct a value, select the right text in the report.")}
    <div class="fhead"><h2 class="h1">Extract fields</h2><span class="factions" style="margin:0"><button class="link" id="newField">${icon("plus")}New field</button></span></div>
    <div class="fields" role="list">${S.fields.map((f) => fieldRow(r, f)).join("")}</div>${traceBlock(r)}`, foot);
  $("newField").onclick = () => chatOpen();
  if ($("confirmAll")) $("confirmAll").onclick = () => confirmAll(r);
  if ($("approve")) $("approve").onclick = () => approve(r);
  if ($("retry")) $("retry").onclick = () => openFields(r);
  wireRows(r);
}
function fieldRow(r, f) {
  const res = r.results[f.key], saved = r.saved[f.key], on = r.focus && r.focus.key === f.key;
  const head = (st) => `<div class="fhead"><span class="fname">${esc(f.name)}</span>${st}</div>`;
  if (saved) {
    const corrected = !["correct", "true_empty"].includes(saved.outcome);
    return `<div class="frow ${saved.value == null ? "not-stated" : ""}" role="listitem">${head(saved.value == null ? pill("not-stated") : pill("verified"))}
      <div class="fval">${saved.value != null ? esc(saved.value) + unit(f, saved.value) : "Not stated"}</div>
      <div class="sm muted">${corrected ? "Edited by you. PrivLab learned from it." : "Confirmed."}</div></div>`;
  }
  if (!res) return `<div class="frow loading" role="listitem"><span class="fname">${esc(f.name)}</span><span class="running"><span class="spin"></span>Reading the de-identified text</span></div>`;
  const [k] = status(res), top = (res.candidates || []).find((c) => c.id === res.candidate_id);
  const editor = r.editing === f.key ? editorHtml(r, f) : "";
  const quote = (c) => c ? `<div class="fquote">“${esc(c.evidence_text.slice(0, 160))}” · ${esc(sectionName(c.section))}${c.start != null ? ` · ${c.start}–${c.end}` : ""}</div>` : "";
  if (k === "verified") return `<div class="frow ${on ? "on" : ""}" role="listitem" tabindex="0" data-row="${f.key}" data-cid="${top.id}" aria-label="${esc(f.name)}: ${esc(res.value)}. Select to show its quote.">${head(pill("verified"))}
      <div class="fval">${esc(res.value)}${unit(f, res.value)}</div>${quote(top)}
      <div class="factions"><button class="link" data-act="accept" data-key="${f.key}" data-cid="${top.id}">Confirm value</button>
      <button class="link" data-act="edit" data-key="${f.key}">Edit value</button></div>${editor}</div>`;
  if (k === "not-stated") return `<div class="frow not-stated" role="listitem">${head(pill("not-stated"))}
      <div class="freason">The report does not state this field.</div>
      <div class="factions"><button class="link" data-act="missing" data-key="${f.key}">Confirm not stated</button>
      <button class="link" data-act="edit" data-key="${f.key}">It is stated</button></div>${editor}</div>`;
  const valid = (res.candidates || []).filter((c) => !c.fail);
  if (k === "refused") {
    const failed = (res.candidates || [])[0];
    return `<div class="frow" role="listitem">${head(pill("refused"))}
      <div class="freason">${failed ? esc(FAIL[failed.fail] || "A check refused the value.") : esc(res.reason || "")} The value is not shown.</div>
      <div class="factions"><button class="link" data-act="edit" data-key="${f.key}">Edit value</button>
      <button class="link" data-act="missing" data-key="${f.key}">Not stated</button></div>${editor}</div>`;
  }
  const focusC = r.focus && r.focus.key === f.key ? valid.find((c) => c.id === r.focus.cid) : null;
  return `<div class="frow ${on ? "on" : ""}" role="listitem">${head(pill("review"))}
    <div class="freason">${esc(res.reason || "")}</div>
    <div class="choices">${valid.map((c) => `<button class="choice" data-act="pick" data-key="${f.key}" data-cid="${c.id}" data-show="${c.id}">${esc(c.value)}${unit(f, c.value)}</button>`).join("")}</div>
    ${quote(focusC || valid[0])}
    <div class="factions"><button class="link" data-act="edit" data-key="${f.key}">Edit value</button>
    <button class="link" data-act="missing" data-key="${f.key}">Not stated</button></div>${editor}</div>`;
}
function editorHtml(r, f) {
  const ed = r.edit || {};
  const input = f.type === "choice"
    ? `<select class="in" id="edVal" aria-label="Value">${f.choices.map((c) => `<option ${c === ed.value ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`
    : `<input class="in" id="edVal" inputmode="decimal" aria-label="Value" placeholder="Value${f.unit ? " in " + esc(f.unit) : ""}" value="${esc(ed.value || "")}">`;
  return `<div class="editor" data-stop>${input}<div class="sm ${ed.evidence ? "" : "muted"}">${ed.evidence ? `Quote: <span class="fquote">“${esc(ed.evidence.slice(0, 100))}”</span>` : "Select the quote for this value in the report."}</div>

}
function wireRows(r) {

    b.onclick = (e) => { if (!e.target.closest("[data-act], [data-stop]")) pick(); };

  pb.querySelectorAll("[data-act]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); act(r, b.dataset.act, b.dataset.key, b.dataset.cid); });
  if ($("edSave")) {
    $("edSave").onclick = (e) => {
      e.stopPropagation();
      const v = $("edVal").value.trim();
      if (!v) return toast("Type the value first.");
      if (!r.edit || !r.edit.evidence) return toast("Select the quote for this value in the report, then save.");
      act(r, "typed", r.editing, null, {value: v, evidence_text: r.edit.evidence});
    };
    $("edCancel").onclick = (e) => { e.stopPropagation(); r.editing = null; r.edit = null; renderMain(); };
    $("edVal").onclick = (e) => e.stopPropagation();
  }
}
async function act(r, kind, key, cid, typed) {
  if (kind === "edit") { r.editing = key; r.edit = r.edit && r.edit.key === key ? r.edit : {key}; return renderMain(); }
  const body = {deid_id: r.deid, field: key};
  if (kind === "accept" || kind === "pick") body.candidate_id = cid;
  else if (kind === "missing") body.missing = true;
  else Object.assign(body, typed);
  const out = await api("/api/confirm_field", body);
  if (out.error || out.status !== "saved") return toast(out.error || out.reason || "The value was not saved. Try again.");
  r.saved[key] = out;
  if (kind === "typed") r.typed++;
  if (r.editing === key) { r.editing = null; r.edit = null; }
  const f = S.fields.find((x) => x.key === key);
  if (f) f.readiness = out.readiness;
  trace(r, `${f ? f.name : key}: ${out.outcome === "correct" ? "confirmed" : out.outcome === "true_empty" ? "confirmed not stated" : "edited; PrivLab learned from it"}.`, "local");
  refresh(r);
}
async function confirmAll(r) {
  for (const f of S.fields) {
    const res = r.results[f.key];
    if (res && status(res)[0] === "verified" && !r.saved[f.key]) await act(r, "accept", f.key, res.candidate_id);
  }
}

// ======================================================================
// Step 3: approve
// ======================================================================
function approve(r) { r.step = "approved"; r.doneAt = performance.now(); r.approvedAt = new Date(); render(); }
function viewApproved(r) {
  stepper(3); where(LOCAL);
  setDoc(marked(r.dtext, redactions(r.dtext)));
  const filled = Object.values(r.saved).filter((o) => o.value != null).length;
  const next = S.reports.findIndex((x, i) => i !== S.cur && x.step !== "approved");
  setPanel(`${banner("verified", `Approved by you at ${clock(r.approvedAt)}`, `${filled} field${filled === 1 ? "" : "s"} filled, ${r.typed} typed by hand, in ${fmtSecs((r.doneAt - r.openedAt) / 1000)}. Fields are now read-only.`)}
    <div class="fields" role="list">${S.fields.map((f) => { const o = r.saved[f.key]; return `<div class="frow" role="listitem"><div class="fhead"><span class="fname">${esc(f.name)}</span>
      ${o ? pill(o.value == null ? "not-stated" : "verified") : ""}</div><div class="fval">${o ? (o.value != null ? esc(o.value) + unit(f, o.value) : "Not stated") : "–"}</div></div>`; }).join("")}</div>
    ${traceBlock(r)}`,
    `${next >= 0 ? `<button class="btn primary" id="go">Next report ${icon("arrow")}</button>` : `<button class="btn primary" id="go">${icon("plus")}Add more reports</button>`}
     <a class="btn secondary" href="/api/export.csv">${icon("down")}Download registry CSV</a>`);
  $("go").onclick = () => next >= 0 ? select(next) : (S.cur = -1, render());
}

function traceBlock(r) {
  if (!r.trace.length) return "";
  return `<details class="trace"><summary>How PrivLab handled this report (${r.trace.length} step${r.trace.length === 1 ? "" : "s"})</summary><ul class="list">
    ${r.trace.map((t) => `<li>${t.where === "cloud" ? CLOUD : LOCAL}<span style="color:${t.ok ? "inherit" : "var(--review)"}">${esc(t.msg)}</span></li>`).join("")}</ul></details>`;
}

// ======================================================================
// Selection toolbar
// ======================================================================
function hideFloat() { $("floatbar").style.display = "none"; }
document.addEventListener("mouseup", (e) => {
  if (e.target.closest("#floatbar")) return;
  setTimeout(() => {
    const r = cur(), sel = docSelection();
    if (!r || !sel || !["review", "fields"].includes(r.step)) return hideFloat();
    const bar = $("floatbar");
    if (r.step === "review") {
      bar.innerHTML = `<span style="padding:0 var(--s2)">Hide as</span><select id="fbType" aria-label="Identifier type">${TYPES.map((t) => `<option value="${t}">${TL[t]}</option>`).join("")}</select>
        <button id="fbGo">Hide</button>`;
      $("fbGo").onclick = () => { r.add.push({text: sel.text, type: $("fbType").value}); hideFloat(); window.getSelection().removeAllRanges(); renderMain(); };
    } else {
      const open = S.fields.filter((f) => !r.saved[f.key]);
      bar.innerHTML = `<span style="padding:0 var(--s2)">Use as</span>${open.map((f) => `<button data-use="${f.key}">${esc(f.name)}</button>`).join('<span class="sep"></span>') || '<span style="padding:0 var(--s2)">All fields saved</span>'}`;
      bar.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => {
        const f = S.fields.find((x) => x.key === b.dataset.use);
        const num = (sel.text.match(/\d+(?:\.\d+)?/) || [""])[0];
        const choice = f.type === "choice" ? (f.choices.find((c) => sel.text.toLowerCase().includes(c.toLowerCase())) || f.choices[0]) : null;
        r.editing = f.key; r.edit = {key: f.key, evidence: sel.text, value: f.type === "number" ? num : choice};
        hideFloat(); renderMain();
      });
    }
    bar.style.display = "flex";
    const w = bar.offsetWidth;
    bar.style.left = Math.max(8, Math.min(innerWidth - w - 8, sel.rect.left + sel.rect.width / 2 - w / 2)) + "px";
    bar.style.top = Math.max(8, sel.rect.top - 50) + "px";
  }, 0);
});
$("docwrap").addEventListener("scroll", hideFloat);
$("view").addEventListener("click", (e) => {
  const m = e.target.closest("mark"), r = cur();
  if (!m || !r || !m.dataset.id || !window.getSelection().isCollapsed) return;
  if (r.step === "review") {
    if (m.dataset.id.startsWith("add")) { r.add.splice(+m.dataset.id.slice(3), 1); renderMain(); }
    else toggleKeep(r, m.dataset.id);
  } else if (r.step === "hold" || r.step === "flags") {
    const q = r.question; q.picked.has(m.dataset.id) ? q.picked.delete(m.dataset.id) : q.picked.add(m.dataset.id); renderMain();
  }
});

// ======================================================================
// Fields: list and new-field conversation, in the side panel
// ======================================================================
$("fieldsBtn").onclick = () => { S.side = S.side ? null : "fields"; afterSideClose(); renderMain(); };
function readiness(x) { return `<span class="pill ${x === "ready" ? "verified" : ""}">${x === "ready" ? "Ready" : x === "learning" ? "Learning" : "New"}</span>`; }
const specLine = (d) => d.type === "number"
  ? `A number${d.unit ? ` in ${esc(d.unit)}` : ""}${d.range_min != null ? `, ${d.range_min}–${d.range_max}` : (d.range ? `, ${d.range[0]}–${d.range[1]}` : "")}`
  : `One of: ${(d.choices || []).map(esc).join(", ")}`;
const say = (who, html) => S.chat.msgs.push({who, html});

function renderSide(r) {
  const n = S.fields.length, c = S.chat;
  const tabs = `<div class="ptabs"><div class="seg" role="tablist" aria-label="Fields">
      <button role="tab" id="tabFields" aria-pressed="${S.side === "fields"}">Fields · ${n}</button>
      <button role="tab" id="tabNew" aria-pressed="${S.side === "chat"}">${icon("plus")} New field</button></div>
    <button class="link" id="sideClose">Close</button></div>`;
  if (S.side === "fields") {
    setPanel(`${tabs}<p class="lede">The fields PrivLab fills on every report. Each one learns from your corrections.</p>
      <ul class="list flist">${n ? S.fields.map((f) => `<li class="item"><div class="grow"><b>${esc(f.name)}</b> ${readiness(f.readiness)}
        <div class="meta">${esc(f.meaning)}</div><div class="meta">${specLine(f)}</div></div>
        <button class="link" data-redefine="${f.key}">Redefine</button><button class="link" data-remove="${f.key}">Remove</button></li>`).join("")
        : '<li class="item muted">No fields yet. Your field pack starts empty.</li>'}</ul>`,
      `<button class="btn primary" id="sideNew">${icon("plus")}New field</button>`);
    $("sideNew").onclick = () => chatOpen();
    document.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => removeField(b));
    document.querySelectorAll("[data-redefine]").forEach((b) => b.onclick = () => chatOpen(S.fields.find((f) => f.key === b.dataset.redefine)));
  } else {
    const thread = c.msgs.map((m) => m.who === "note" ? `<div class="msg note">${m.html}</div>`
      : `<div class="msg ${m.who}"><span class="who">${m.who === "you" ? "You" : "Muse Spark"}</span>${m.html}</div>`).join("")
      + (c.busy ? `<div class="msg spark typing" aria-label="Muse Spark is replying"><span></span><span></span><span></span></div>` : "");
    setPanel(`${tabs}<div class="thread" id="thread" aria-live="polite">${thread}</div>`, chatFooter(c));
    draftDetails();
    wireChat(r);
    const pb = $("pbody"); pb.scrollTop = pb.scrollHeight;
  }
  $("tabFields").onclick = () => { S.side = "fields"; renderMain(); };
  $("tabNew").onclick = () => chatOpen();
  $("sideClose").onclick = () => { S.side = null; afterSideClose(); renderMain(); };
}
function afterSideClose() {
  const r = cur();
  if (!S.side && r && r.step === "fields") openFields(r);           // fill fields added meanwhile
}
function chatFooter(c) {
  const input = (ph) => `<div class="composer"><input class="in" id="chatIn" placeholder="${ph}" aria-label="Message" autocomplete="off"${c.busy ? " disabled" : ""}>
    <button class="btn primary" id="chatSend"${c.busy ? " disabled" : ""}>Send</button></div>`;
  if (c.busy) return `<button class="btn primary" disabled>Muse Spark is replying…</button>`;
  return {
    name: input("Field name, for example tumour size"),
    refine: input("What should it mean? In your own words"),
    confirm: `<button class="btn primary" id="cYes">Yes, save this field</button><button class="btn secondary" id="cNo">Not quite</button>`,
    preview: `<button class="btn primary" id="pYes">Yes, that's it</button><button class="btn secondary" id="pNo">No, that's not it</button>`,
    missing: `<button class="btn primary" id="mYes">Correct, it is not stated</button><button class="btn secondary" id="mNo">It is stated</button>`,
    done: `<button class="btn primary" id="dMore">${icon("plus")}Add another field</button><button class="btn secondary" id="dBack">Back to the report</button>`,
  }[c.stage];
}
function wireChat(r) {
  const c = S.chat, inp = $("chatIn");
  if (inp) {
    inp.focus();
    const send = () => { const t = inp.value.trim(); if (t) chatSend(t); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } };
    $("chatSend").onclick = send;
  }
  if ($("cYes")) $("cYes").onclick = () => chatSave(r);
  if ($("cNo")) $("cNo").onclick = () => { say("you", "Not quite"); say("spark", "What should it mean instead? Describe it in your own words, for example <i>only the invasive tumour, not the whole specimen</i>."); c.stage = "refine"; renderMain(); };
  if ($("pYes")) $("pYes").onclick = () => chatPreviewYes(r);
  if ($("pNo")) $("pNo").onclick = () => { say("you", "No, that's not it"); say("spark", "What did you mean? Describe it in your own words, and I will look again."); c.stage = "refine"; if (r) delete r.results[c.key]; renderMain(); };
  if ($("mYes")) $("mYes").onclick = async () => { say("you", "Correct, it is not stated"); await act(r, "missing", c.key); say("note", "Saved as not stated. PrivLab learns from it."); c.stage = "done"; renderMain(); };
  if ($("mNo")) $("mNo").onclick = () => { say("you", "It is stated"); say("spark", "Select the right text in the report, then choose <b>Use as</b> and this field. That teaches me where to look."); c.stage = "done"; renderMain(); };
  if ($("dMore")) $("dMore").onclick = () => { S.chat = null; chatOpen(); };
  if ($("dBack")) $("dBack").onclick = () => { S.side = null; afterSideClose(); renderMain(); };
  const det = $("cDetails");
  if (det) det.onclick = () => { c.editDetails = !c.editDetails; renderMain(); };
}
function chatOpen(field) {
  S.side = "chat";
  if (field) {
    S.chat = {msgs: [], stage: "refine", name: field.name, key: field.key};
    say("spark", `You are redefining <b>${esc(field.name)}</b>. It currently means: ${esc(field.meaning)}<span class="spec">${specLine(field)}</span>`);
    say("spark", "What should it mean instead? Describe it in your own words.");
  } else if (!S.chat || S.chat.stage === "done") {
    S.chat = {msgs: [], stage: "name"};
    say("spark", "Which field should PrivLab fill? Type its name, for example <i>tumour size</i>, <i>pT</i> or <i>lymphovascular invasion</i>.");
  }
  renderMain();
}
async function chatSend(text) {
  const c = S.chat;
  say("you", esc(text));
  if (c.stage === "name") { c.name = text; c.desc = null; } else c.desc = text;
  c.busy = true; renderMain();
  const res = await api("/api/define", {name: c.name, description: c.desc || null});
  c.busy = false;
  if (res.error || !res.draft) { say("spark", `I could not suggest a definition. ${esc(res.error || "")} Try again.`); return renderMain(); }
  if (!c.noted) { say("note", "Only the field name and your words were sent. No report text."); c.noted = true; }
  c.draft = res.draft; c.editDetails = false; c.stage = "confirm";
  say("spark", `Did you mean: <b>${esc(res.draft.meaning_question)}</b><span class="spec">${specLine(res.draft)}</span>
    <button class="link" id="cDetails">Edit details</button>`);
  renderMain();
}
function draftDetails() {          // the editable details live inside the last Muse Spark message
  const c = S.chat;
  if (!c.editDetails || c.stage !== "confirm") return;
  const d = c.draft, last = [...document.querySelectorAll(".msg.spark")].pop();
  last.insertAdjacentHTML("beforeend", `<div class="details">
    <textarea class="in" id="dQ" rows="2" aria-label="Meaning">${esc(d.meaning_question)}</textarea>
    <div style="display:flex;gap:var(--s2)"><select class="in" id="dType" style="width:130px" aria-label="Type"><option ${d.type === "number" ? "selected" : ""}>number</option><option ${d.type === "choice" ? "selected" : ""}>choice</option></select>
    ${d.type === "number" ? `<input class="in" id="dUnit" placeholder="Unit, for example cm" value="${esc(d.unit || "")}" aria-label="Unit">` : ""}</div>
    ${d.type === "choice" ? `<input class="in" id="dChoices" placeholder="Choices, separated by commas" value="${esc((d.choices || []).join(", "))}" aria-label="Choices">` : ""}</div>`);
  $("dType").onchange = () => { readDetails(); c.draft.type = $("dType").value; renderMain(); };
}
function readDetails() {
  const d = S.chat.draft;
  if ($("dQ")) d.meaning_question = $("dQ").value.trim() || d.meaning_question;
  if ($("dUnit")) d.unit = $("dUnit").value.trim() || null;
  if ($("dChoices")) d.choices = $("dChoices").value.split(",").map((x) => x.trim()).filter(Boolean);
}
async function chatSave(r) {
  const c = S.chat;
  readDetails();
  say("you", "Yes, save this field");
  c.busy = true; renderMain();
  const accept = {...c.draft, key: c.key || c.draft.key};
  const res = await api("/api/define", {name: c.name, description: c.desc || null, accept});
  if (res.error || !res.field) { c.busy = false; say("spark", `The field was not saved. ${esc(res.error || "")}`); c.stage = "confirm"; return renderMain(); }
  c.key = res.field.key;
  await loadFields();
  say("note", `Saved <b>${esc(c.name)}</b>. It will be filled on every report.`);
  for (const x of S.reports) delete x.results[c.key];                 // re-read with the new meaning
  S.reports.filter((x) => x !== r && x.step === "safe" && x.prefetch !== "running").forEach(prefetch);
  if (!r || !r.dtext || r.leftover || !["safe", "fields"].includes(r.step)) {
    c.busy = false; c.stage = "done";
    say("spark", "Open a de-identified report and I will highlight this field in it.");
    return renderMain();
  }
  r.step = "fields"; renderMain();
  const found = await api("/api/find", {deid_id: r.deid, field: c.key});
  c.busy = false;
  if (found.error || found.status === "error") { say("spark", `I could not read the report. ${esc(found.error || found.reason || "")}`); c.stage = "done"; return renderMain(); }
  r.results[c.key] = found;
  const [k] = status(found), cand = (found.candidates || []).find((x) => x.id === found.candidate_id) || (found.candidates || []).find((x) => !x.fail);
  const f = S.fields.find((x) => x.key === c.key);
  if (k === "not-stated") {
    say("spark", `This report does not seem to state <b>${esc(c.name)}</b>. Is that right?`); c.stage = "missing";
  } else if (k === "refused" || !cand) {
    say("spark", `I found something, but it failed a check: ${esc((FAIL[(found.candidates || [])[0]?.fail]) || found.reason || "")} Select the right text in the report and choose <b>Use as</b> to show me.`);
    c.stage = "done";
  } else {
    r.focus = {key: c.key, cid: cand.id};
    say("spark", `In ${esc(r.name)} I found <span class="found">${esc(cand.value)}${unit(f, cand.value)}</span>${cand.section && cand.section !== "other" ? ` in the ${esc(sectionName(cand.section))} section` : ""}, highlighted in the report. Is this what you mean?
      <span class="spec">“${esc(cand.evidence_text.slice(0, 140))}”</span>`);
    c.preview = cand.id; c.stage = "preview";
  }
  renderMain();
  if (r.focus) showMark(`${r.focus.key}:${r.focus.cid}`);
}
async function chatPreviewYes(r) {
  const c = S.chat;
  say("you", "Yes, that's it");
  await act(r, "accept", c.key, c.preview);
  say("note", "Confirmed. PrivLab learns from it, so the next report starts closer.");
  c.stage = "done"; renderMain();
}
async function removeField(b) {
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Click again to remove"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Remove"; }, 3500); return; }
  const res = await api("/api/remove_field", {field: b.dataset.remove});
  if (res.error) return toast(res.error);
  for (const x of S.reports) { delete x.results[b.dataset.remove]; delete x.saved[b.dataset.remove]; }
  await loadFields(); renderMain();
  toast("Field removed. Values already exported are not changed.");
}
async function loadFields() { const p = await api("/api/pack"); S.fields = p.fields || []; }

// ======================================================================
// Keyboard and start-up
// ======================================================================
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, dialog") || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = cur();
  if (r && r.step === "fields" && (e.key === "ArrowDown" || e.key === "ArrowUp")) {     // move between fields
    e.preventDefault();
    const rows = [...document.querySelectorAll("#pbody [data-row]")];
    if (!rows.length) return;
    const i = rows.findIndex((x) => r.focus && x.dataset.row === r.focus.key);
    const nx = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
    r.focus = {key: nx.dataset.row, cid: nx.dataset.cid}; renderMain(); showMark(`${nx.dataset.row}:${nx.dataset.cid}`);
    document.querySelector(`#pbody [data-row="${CSS.escape(nx.dataset.row)}"]`)?.focus();
  } else if (r && r.step === "fields" && e.key.toLowerCase() === "r" && r.focus) {      // confirm the selected field
    const res = r.results[r.focus.key];
    if (res && !r.saved[r.focus.key] && status(res)[0] === "verified") act(r, "accept", r.focus.key, res.candidate_id);
  } else if (e.key === "Enter" && !e.target.closest("button, a")) {
    const b = document.querySelector("#pfoot .primary:not(:disabled)");
    if (b) { e.preventDefault(); b.click(); }
  } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && S.reports.length) {
    e.preventDefault();
    select(Math.max(0, Math.min(S.reports.length - 1, S.cur + (e.key === "ArrowDown" ? 1 : -1))));
  } else if (e.key === "Escape") hideFloat();
});
function setMode(m) {
  S.mode = m; store.set("mode", m);
  $("modeDeid").setAttribute("aria-pressed", m === "deid"); $("modeBoth").setAttribute("aria-pressed", m === "both");
  $("fieldsBtn").style.display = m === "both" ? "" : "none"; $("expCsv").style.display = m === "both" ? "" : "none";
  if (m === "both" && S.fields.length) S.reports.filter((x) => x.step === "safe" && x.prefetch === "none" && !x.leftover).forEach(prefetch);
  render();
}
$("modeDeid").onclick = () => { S.side = null; setMode("deid"); };
$("modeBoth").onclick = () => setMode("both");
$("expDeid").onclick = (e) => {
  if (!S.reports.some((x) => ["safe", "fields", "approved"].includes(x.step))) { e.preventDefault(); toast("Nothing to export yet. De-identify a report first."); }
  $("exportMenu").open = false;
};
$("expCsv").onclick = () => { $("exportMenu").open = false; };
document.addEventListener("click", (e) => { if (!e.target.closest("#exportMenu")) $("exportMenu").open = false; });

$("resetBtn").onclick = async () => {
  const b = $("resetBtn");
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Click again to clear"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Start over"; }, 3500); return; }
  delete b.dataset.armed; b.textContent = "Start over";
  const r = await api("/api/reset", {});
  if (!r.ok) return toast(r.error || "Start over did not work.");
  S.reports = []; S.cur = -1; S.choices = null;
  S.profile = await api("/api/profile"); await loadFields(); render();
  toast("Clean start: profile, fields and score log cleared.");
};

(async function init() {
  const [reps, prof] = await Promise.all([api("/api/reports"), api("/api/profile")]);
  if (reps.error) {
    $("view").innerHTML = `<div class="empty">${banner("refused", "The PrivLab server is not reachable", "Start it with python -m viewer.server, then reload this page.")}</div>`;
    return;
  }
  S.samples = reps.reports || []; S.demo = !!reps.demo; S.profile = prof;
  $("mode").style.display = S.demo ? "" : "none";
  $("resetBtn").style.display = S.demo ? "" : "none";
  await loadFields();
  setMode(S.mode);
})();
</script>
</body>
